<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cidade Dorme</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:700;background:#0b0a17;color:var(--fg);-webkit-tap-highlight-color:transparent}
body.noite{--bg:#15132b;--fg:#fbeed6;--muted:#c9c3ea;--panel:#221d45;--trilho:#2e2858}
body.dia{--bg:#fbeed6;--fg:#15131f;--muted:#4a4560;--panel:#ffffff;--trilho:#e6dcc6}
#app{position:relative;max-width:440px;min-height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;transition:background .4s}
.cena{display:block;width:100%;height:30vh;max-height:250px;min-height:150px;object-fit:cover;object-position:50% 20%;border-bottom:4px solid #0b0a17;background:#0b0a17}
.cena.baixa{height:15vh;min-height:96px;max-height:130px}
.cena.apagao{animation:apagao 9s forwards}
@keyframes apagao{0%{filter:none}18%{filter:brightness(.45)}22%{filter:none}38%{filter:brightness(.35)}42%{filter:brightness(.85)}58%{filter:brightness(.3) saturate(.7)}100%{filter:brightness(.22) saturate(.5)}}
.cena.alta{height:50vh;max-height:none;object-position:50% 10%;animation:sangue 1s infinite}
.corpo{flex:1;display:flex;flex-direction:column;gap:18px;padding:20px 22px calc(26px + env(safe-area-inset-bottom))}
.centro{align-items:center;text-align:center}
.rotulo{font-size:14px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:0}
h1,h2{font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:.5px;margin:0;line-height:1.08}
h1{font-size:30px}h1:focus{outline:none}
h1.titulo{font-size:54px;line-height:.95;color:#ffc22e;text-shadow:0 4px 0 #0b0a17}
h2{font-size:28px}
p{margin:0;font-size:16px;color:var(--muted)}
.cresce{flex:1}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #9db4ff;outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:8px 16px;border-radius:14px;background:#ffc22e;color:#15131f;border:3px solid #0b0a17;box-shadow:0 5px 0 #0b0a17;font-family:'Lilita One',sans-serif;font-size:23px;letter-spacing:.5px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b0a17}
.btn:disabled{background:#8d88a8;color:#2b2840;box-shadow:none;cursor:not-allowed}
.btn.sec{background:#7a55c7;color:#fff;min-height:50px;font-size:19px}
.som{position:absolute;top:10px;right:10px;z-index:2;width:46px;height:46px;border-radius:50%;border:3px solid #0b0a17;background:#221d45;color:#fbeed6;display:grid;place-items:center;padding:0}
.linha{display:flex;gap:10px}
.seg{flex:1;min-height:48px;border-radius:12px;border:3px solid #0b0a17;background:var(--panel);color:var(--fg);font-size:18px;font-weight:800}
.seg[aria-pressed=true]{background:#7a55c7;color:#fff}
.nomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nome{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid #0b0a17;border-radius:14px;padding:5px 8px 5px 5px}
.nome input{flex:1;min-width:0;height:40px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;font-weight:800}
.nome input::placeholder{color:#8f89b5}
.av{flex-shrink:0;border-radius:50%;object-fit:cover;object-position:50% 25%;border:3px solid #0b0a17;background:#fbeed6;width:44px;height:44px}
.av.g{width:150px;height:150px;border-width:4px}
.av.fora{filter:grayscale(1) opacity(.45)}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.op{display:flex;align-items:center;gap:9px;min-height:66px;padding:6px 9px;border-radius:16px;border:3px solid #0b0a17;background:var(--panel);color:var(--fg);font-size:17px;font-weight:800;text-align:left}
.op span{flex:1;min-width:0;overflow-wrap:anywhere}
.op[aria-pressed=true]{background:#7a55c7;color:#fff;box-shadow:0 4px 0 #0b0a17}
.op.larga{grid-column:1/-1;justify-content:center;min-height:50px;border-style:dashed;background:transparent}
.op.larga[aria-pressed=true]{background:#7a55c7}
.cartao{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;background:#fbeed6;color:#15131f;border:4px solid #0b0a17;border-radius:24px;box-shadow:0 8px 0 #0b0a17;padding:22px 18px;text-align:center}
.cartao p{color:#3d3852}
.cartao img.ico{width:150px;height:150px}
.carta-btn{padding:0;border:0;background:none;perspective:900px}
.carta{position:relative;width:min(62vw,270px);aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .55s}
.carta.virada{transform:rotateY(180deg)}
.carta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:18px;border:4px solid #0b0a17;box-shadow:0 8px 0 #0b0a17;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.carta img.frente{transform:rotateY(180deg)}
.relogio{font-family:'Lilita One',sans-serif;font-size:72px;line-height:1;letter-spacing:2px;font-variant-numeric:tabular-nums;color:#15131f}
.relogio.tenso{color:#b3141c;animation:pulsa .5s infinite}
.barra{width:100%;height:16px;border-radius:999px;border:3px solid #0b0a17;background:#e6dcc6;overflow:hidden}
.barra i{display:block;height:100%;background:#7a55c7;transition:width 1s linear}
.fichas{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px}
.ficha{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;font-size:12px;font-weight:800;overflow-wrap:anywhere;text-align:center}
.ficha.fora{color:var(--muted);text-decoration:line-through}
.votos{display:flex;flex-direction:column;gap:8px;width:100%}
.voto{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800}
.voto b{width:86px;overflow-wrap:anywhere;text-align:left}
.voto .t{flex:1;height:18px;border-radius:999px;background:var(--trilho);border:3px solid #0b0a17;overflow:hidden}
.voto .t i{display:block;height:100%;width:0;background:#7a55c7;transition:width .45s}
.voto .c{width:14px}
.papel{display:flex;align-items:center;gap:9px;background:var(--panel);border:3px solid #0b0a17;border-radius:16px;padding:7px 9px}
.papel div{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;font-size:16px;font-weight:800;overflow-wrap:anywhere}
.chip{font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;white-space:nowrap}
.aviso{font-size:14px}
.tag{display:inline-block;margin-top:2px;font-size:10px;font-weight:800;letter-spacing:.3px;border-radius:999px;padding:1px 7px;background:#146b34;color:#fff}
.op .tag{margin-left:6px}
.op.jop{justify-content:center;min-height:84px;font-family:'Lilita One',sans-serif;font-weight:400;font-size:24px;color:var(--cor);border-color:var(--cor)}
.op.jop[aria-pressed=true]{background:var(--cor);color:#fff;border-color:#0b0a17}
.placar{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.placar div{display:flex;flex-direction:column;align-items:center;background:#fff;border:4px solid #0b0a17;border-radius:20px;box-shadow:0 6px 0 #0b0a17;padding:10px;font-size:15px;font-weight:800;color:var(--cor)}
.placar b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:64px;line-height:1}
.seg{font-size:16px}
.campo{display:flex;flex-direction:column;gap:8px}
.campo input{width:100%;height:54px;border-radius:14px;border:3px solid #0b0a17;background:#fbeed6;color:#15131f;font:inherit;font-size:18px;font-weight:800;padding:0 16px}
.campo input::placeholder{color:#8a8472}
input.codigo{text-transform:uppercase;letter-spacing:4px}
.ou{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.ou::before,.ou::after{content:"";flex:1;height:3px;background:var(--trilho)}
.erro{background:#b3141c;color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;border:3px solid #0b0a17}
.sala{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:3px solid #0b0a17;border-radius:16px;padding:12px 14px}
.sala div{display:flex;flex-direction:column;gap:2px}
.sala b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:42px;line-height:1;letter-spacing:5px;color:#ffc22e}
.btn.mini{width:auto;flex:1;min-height:46px;font-size:16px;padding:6px 12px}
.iabox{background:var(--panel);border:3px solid #0b0a17;border-radius:16px;padding:12px 14px}
.iabox p{font-size:15px}
.iabox a{color:#ffc22e}
.aguardando{text-align:center;padding:16px 0;font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#chatRoot[hidden]{display:none}
.topoesq{position:fixed;top:10px;left:max(10px,calc(50% - 210px));z-index:6;display:flex;align-items:center;gap:8px}
.chatbtn{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid #0b0a17;background:#221d45;color:#fbeed6;display:grid;place-items:center;padding:0}
.chatbtn.on{background:#146b34}
.chatbtn .badge[hidden]{display:none}
.chatbtn .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#d91c24;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #0b0a17}
.micdica{font-size:12px;font-weight:800;color:#fbeed6;background:rgba(11,10,23,.75);border-radius:999px;padding:3px 8px}
.chattoast{position:fixed;top:64px;left:max(10px,calc(50% - 210px));right:max(10px,calc(50% - 210px));z-index:6;background:#fbeed6;color:#15131f;border:3px solid #0b0a17;border-radius:14px;box-shadow:0 4px 0 #0b0a17;padding:8px 12px;font-size:15px;font-weight:700;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s}
.chattoast.on{opacity:1;transform:none}
.chatpainel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(440px,100%);height:min(72vh,620px);z-index:7;display:flex;flex-direction:column;background:#15132b;color:#fbeed6;border:3px solid #0b0a17;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 0 rgba(11,10,23,.5)}
.chatpainel[hidden]{display:none}
.chatcab{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;border-bottom:3px solid #0b0a17}
.chattabs{flex:1;display:flex;gap:6px;overflow-x:auto}
.chattabs button{min-height:40px;border-radius:999px;border:3px solid #0b0a17;background:#221d45;color:#fbeed6;font-weight:800;font-size:14px;padding:0 14px;white-space:nowrap}
.chattabs button[aria-selected=true]{background:#7a55c7}
.chatfechar{width:44px;height:44px;border-radius:50%;border:3px solid #0b0a17;background:#221d45;color:#fbeed6;display:grid;place-items:center;padding:0}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{align-self:flex-start;max-width:85%;background:#221d45;border:2px solid #0b0a17;border-radius:14px 14px 14px 4px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.msg b{font-size:13px;color:#ffc22e}
.msg b i{font-style:normal;font-size:10px;background:#3d4a73;color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.msg.minha{align-self:flex-end;background:#7a55c7;border-radius:14px 14px 4px 14px}
.msg.sis{align-self:center;background:none;border:0;color:#c9c3ea;font-size:13px;font-style:italic;text-align:center;padding:2px 6px}
.chatform{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:3px solid #0b0a17}
.chatform input{flex:1;min-width:0;height:48px;border-radius:14px;border:3px solid #0b0a17;background:#fbeed6;color:#15131f;font:inherit;font-size:16px;font-weight:700;padding:0 12px}
.chatform input:disabled{background:#3a355c;color:#c9c3ea}
.chatform input:disabled::placeholder{color:#c9c3ea}
.chatenviar{width:52px;height:48px;border-radius:14px;border:3px solid #0b0a17;background:#ffc22e;color:#15131f;display:grid;place-items:center;padding:0}
.chatenviar:disabled{background:#8d88a8}
.revela{opacity:0;visibility:hidden;transform:scale(.9)}
.revela.mostra{opacity:1;visibility:visible;transform:none;transition:opacity .35s,transform .35s}
.pulsa{animation:pulsa 1s infinite}
.tremor{animation:tremor .5s}
.clarao{position:fixed;inset:0;z-index:5;background:#d91c24;pointer-events:none;animation:clarao .7s forwards}
@keyframes pulsa{50%{opacity:.35}}
@keyframes sangue{50%{filter:brightness(1.4) saturate(1.35)}}
@keyframes clarao{from{opacity:.75}to{opacity:0}}
@keyframes tremor{0%,100%{transform:none}15%{transform:translateX(-9px) rotate(-2deg)}30%{transform:translateX(8px) rotate(2deg)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@media (prefers-reduced-motion:reduce){.chattoast{transition:none}.cena.apagao{animation:none;filter:brightness(.22) saturate(.5)}.carta,.barra i,#app,.voto .t i,.revela.mostra{transition:none}.pulsa,.tremor,.cena.alta,.relogio.tenso,.clarao{animation:none}.clarao{display:none}}
</style>
</head>
<body class="noite">
<main id="app"></main>
<script src="vendor/peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="online.js"></script>
<script src="ia.js"></script>
<script src="voz.js"></script>
<script>CD.iniciar();</script>
</body>
</html>
